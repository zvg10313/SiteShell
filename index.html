<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="macOS 风格网页截图生成器 - 输入网址即可生成精美带壳截图">
    <title>网页截图生成器 - macOS 风格</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="input-section">
            <h1>🖥️ macOS 风格网页截图生成器</h1>
            <div class="input-group">
                <input type="url" id="urlInput" placeholder="输入网页 URL，例如: https://example.com" />
                <button id="generateBtn" onclick="generatePreview()">生成截图</button>
            </div>
            
            <div class="proxy-selector">
                <label for="proxySelector">选择代理服务（解决跨域问题）：</label>
                <select id="proxySelector">
                </select>
            </div>
            
            <div class="options">
                <div class="option-item">
                    <input type="checkbox" id="showAddress" checked>
                    <label for="showAddress">显示地址栏</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="showControls" checked>
                    <label for="showControls">显示窗口控制按钮</label>
                </div>
                <div class="option-item">
                    <label for="formatSelector">输出格式：</label>
                    <select id="formatSelector">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPEG</option>
                    </select>
                </div>
                <div class="option-item" id="qualityOption">
                    <label for="qualitySlider">质量：</label>
                    <input type="range" id="qualitySlider" min="0.1" max="1" step="0.1" value="0.9">
                    <span id="qualityValue">90%</span>
                </div>
            </div>
            
            <div class="scale-controls">
                <h3>缩放控制</h3>
                <div class="scale-options">
                    <div class="scale-option">
                        <label for="scalePercent">百分比缩放：</label>
                        <input type="range" id="scalePercent" min="50" max="150" value="100" step="5">
                        <span id="scalePercentValue">100%</span>
                    </div>
                </div>
                <div class="scale-options">
                    <div class="scale-option">
                        <label for="customWidth">宽度：</label>
                        <input type="number" id="customWidth" placeholder="自动" min="300" max="2000">
                        <span>px</span>
                    </div>
                    <div class="scale-option">
                        <label for="customHeight">高度：</label>
                        <input type="number" id="customHeight" placeholder="自动" min="300" max="2000">
                        <span>px</span>
                    </div>
                    <div class="scale-option">
                        <button type="button" id="applyScale" onclick="applyCustomScale()">应用</button>
                        <button type="button" id="resetScale" onclick="resetScale()">重置</button>
                    </div>
                </div>
                <div class="scale-options">
                    <div class="scale-option">
                        <label for="backgroundType">网页背景：</label>
                        <select id="backgroundType">
                            <option value="white">纯白</option>
                            <option value="gradient">渐变</option>
                            <option value="grid">网格</option>
                            <option value="dots">点阵</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="note">
                <strong>使用说明：</strong>
                <ul>
                    <li>输入网址后点击"生成截图"按钮</li>
                    <li>如果页面无法加载，尝试切换不同的代理服务</li>
                    <li>如果截图为空白，确保已选择合适的代理服务</li>
                    <li>部分网站可能因安全策略无法加载，这是正常现象</li>
                </ul>
            </div>
        </div>

        <div class="preview-section">
            <div class="preview-header">
                <h2>预览</h2>
                <button id="downloadBtn" class="download-btn" onclick="downloadScreenshot()">📥 下载截图</button>
            </div>
            <div class="browser-mockup" id="browserMockup">
                <div class="browser-toolbar" id="browserToolbar">
                    <div class="window-controls" id="windowControls">
                        <div class="window-btn close"></div>
                        <div class="window-btn minimize"></div>
                        <div class="window-btn maximize"></div>
                    </div>
                    <div class="browser-address-bar" id="addressBar">
                        <span class="lock-icon">🔒</span>
                        <span class="url" id="urlDisplay">https://example.com</span>
                    </div>
                </div>
                <div class="browser-content" id="browserContent">
                    <div class="placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <p>输入 URL 并点击"生成截图"开始</p>
                    </div>
                    <div class="resize-handle" id="resizeHandle" title="拖拽调整显示范围">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
